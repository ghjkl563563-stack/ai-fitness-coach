<!doctype html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>AI 健身教練系統</title>
    <style>
      body {
        background-color: #1e1e1e;
        color: white;
        font-family: "微軟正黑體", sans-serif;
        text-align: center;
        margin: 0;
        padding: 0;
      }
      .btn {
        padding: 15px 30px;
        font-size: 18px;
        font-weight: bold;
        margin: 10px;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        color: white;
        transition: 0.3s;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
      }
      .btn:active {
        transform: scale(0.95);
      }
      .btn-auto {
        background-color: #ff9800;
      }
      .btn-squat {
        background-color: #4caf50;
      }
      .btn-plank {
        background-color: #2196f3;
      }
      .btn-pause {
        background-color: #ffc107;
        color: black;
      }
      .btn-stop {
        background-color: #f44336;
      }

      /* ✨ 語音喚醒按鈕的顏色 */
      .btn-mic {
        background-color: #9c27b0;
      }

      #fullscreen-container {
        position: relative;
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        margin-top: 20px;
      }

      #output-image {
        width: 95%;
        max-width: 1000px;
        height: auto;
        max-height: 75vh;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        background-color: #000;
        object-fit: contain;
        transition: 0.3s;
      }

      .mobile-fullscreen {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        margin: 0 !important;
        z-index: 9999;
        background-color: black;
        justify-content: center !important;
      }
      .mobile-fullscreen #output-image {
        width: 100vw !important;
        height: 100vh !important;
        max-height: none !important;
        border-radius: 0 !important;
      }

      #control-panel {
        position: absolute;
        bottom: 30px;
        z-index: 10000;
        width: 100%;
        display: none;
      }

      video,
      canvas {
        display: none;
      }
    </style>
  </head>
  <body>
    <h2 id="main-title" style="margin-top: 20px">🤖 NCU 雙模態 AI 教練</h2>

    <div id="start-panel" style="text-align: center;">

    <div style="margin-bottom: 30px;">
        <button class="btn btn-auto" onclick="switchMode('auto')">
            🤖 啟動 AI 智能模式
        </button>
    </div>

    <div style="text-align: center;">

        <div style="display: inline-block; text-align: center; margin: 0 15px;">
            <button class="btn btn-squat" onclick="switchMode('1')">🏋️‍♂️ 手動啟動重訓</button>
            <br>
            <span style="color: #aaaaaa; font-size: 14px; display: inline-block; margin-top: 8px;">
                (支援：深蹲、肩推、划船)
            </span>
        </div>

        <div style="display: inline-block; text-align: center; margin: 0 15px;">
            <button class="btn btn-plank" onclick="switchMode('2')">🧘‍♀️ 手動啟動居家</button>
            <br>
            <span style="color: #aaaaaa; font-size: 14px; display: inline-block; margin-top: 8px;">
                (支援：棒式、深蹲、伏地挺身、弓箭步)
            </span>
        </div>

    </div>
</div>

    <div id="fullscreen-container">
      <img
        id="output-image"
        width="640"
        height="480"
        alt="請點擊上方按鈕啟動相機"
      />

      <div id="control-panel">
        <button id="pause-btn" class="btn btn-pause" onclick="togglePause()">
          ⏸️ 暫停
        </button>
        <button id="mic-btn" class="btn btn-mic" onclick="toggleVoiceWake()">
          🎙️ 語音喚醒 (已關閉)
        </button>
        <button class="btn btn-stop" onclick="stopMode()">⏹️ 停止</button>
      </div>
    </div>

    <video id="video" autoplay playsinline></video>
    <canvas id="hidden-canvas" width="640" height="480"></canvas>

    <script>
      // 自動根據目前網頁是 http 還是 https 來決定使用 ws 或 wss
      const protocol =
        window.location.protocol === "https:" ? "wss://" : "ws://";
      const wsUrl = protocol + window.location.host + "/ws";
      const ws = new WebSocket(wsUrl);

      const video = document.getElementById("video");
      const canvas = document.getElementById("hidden-canvas");
      const ctx = canvas.getContext("2d");

      // ==========================================
      // ✨ AI 語音喚醒 (Wake Word) 核心邏輯
      // ==========================================
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition;
      let isListeningContinually = false; // 控制是否要一直監聽
      let isAwake = false; // 紀錄教練是否已經被喚醒
      let awakeTimeout;

      if (SpeechRecognition) {
        recognition = new SpeechRecognition();
        recognition.lang = "zh-TW";
        recognition.continuous = true; // 🌟 關鍵：讓麥克風持續錄音，不要停下來

        recognition.onresult = (event) => {
          // 取得最後一句話
          const lastIndex = event.results.length - 1;
          let transcript = event.results[lastIndex][0].transcript.toLowerCase();
          console.log("🗣️ 監聽到背景音：", transcript);

          // 1. 檢查是否有說出喚醒詞 (加入各種可能的語音辨識結果防呆)
          const wakeWords = [
            "hey教練",
            "嘿教練",
            "hey 教練",
            "黑教練",
            "嗨教練",
            "pay教練",
            "教練"
          ];
          const isWakeWordDetected = wakeWords.some((word) =>
            transcript.includes(word),
          );

          if (isWakeWordDetected) {
            // 立刻打斷教練講話 (Barge-in)
            if (window.speechSynthesis.speaking)
              window.speechSynthesis.cancel();

            // 過濾掉喚醒詞，看看有沒有剩下的指令
            let command = transcript;
            wakeWords.forEach((word) => {
              command = command.replace(word, "");
            });
            command = command.trim();

            if (command !== "") {
              // 狀況 A: 一氣呵成講完 (例："Hey 教練我好累")
              console.log("🚀 觸發完整指令：", command);
              ws.send(JSON.stringify({ action: "chat", message: command }));
              isAwake = false;
            } else {
              // 狀況 B: 只喊了喚醒詞 (例："Hey 教練！")
              console.log("🔔 教練已喚醒，等待指令...");
              isAwake = true;

              let u = new SpeechSynthesisUtterance("在！請說。");
              u.lang = "zh-TW";
              u.rate = 1.2;
              window.speechSynthesis.speak(u);

              // 給予 5 秒鐘的等待時間，如果沒說話就自動解除喚醒狀態
              clearTimeout(awakeTimeout);
              awakeTimeout = setTimeout(() => {
                isAwake = false;
                console.log("💤 等待超時，進入休眠");
              }, 5000);
            }
          }
          // 2. 如果教練已經被喚醒了，把接下來的這句話當成指令送出
          else if (isAwake) {
            if (window.speechSynthesis.speaking)
              window.speechSynthesis.cancel();
            console.log("🚀 送出後續指令：", transcript);
            ws.send(JSON.stringify({ action: "chat", message: transcript }));

            isAwake = false; // 講完後重新進入休眠，等待下一次喚醒
            clearTimeout(awakeTimeout);
          }
        };

        // 🌟 網頁的語音辨識偶爾會自己斷掉，這裡寫一個無敵的重啟機制
        recognition.onend = () => {
          if (isListeningContinually) {
            try {
              recognition.start();
            } catch (e) {}
          }
        };
      }

      // 控制語音喚醒的開關按鈕
      function toggleVoiceWake() {
        if (!recognition) {
          alert("你的瀏覽器不支援語音辨識，請使用 Chrome 瀏覽器！");
          return;
        }

        isListeningContinually = !isListeningContinually;
        const btn = document.getElementById("mic-btn");

        if (isListeningContinually) {
          btn.innerHTML = "🟢 語音喚醒：監聽中";
          btn.style.backgroundColor = "#e91e63"; // 醒目的粉紅色
          try {
            recognition.start();
          } catch (e) {}
          console.log("🎙️ 語音喚醒已開啟");
        } else {
          btn.innerHTML = "🎙️ 語音喚醒 (已關閉)";
          btn.style.backgroundColor = "#9c27b0";
          recognition.stop();
          isAwake = false;
          console.log("🔇 語音喚醒已關閉");
        }
      }

      const outputImg = document.getElementById("output-image");
      const container = document.getElementById("fullscreen-container");
      const mainTitle = document.getElementById("main-title");
      const pauseBtn = document.getElementById("pause-btn");

      let isProcessing = false;
      let isPaused = false;
      let lastFrameTime = 0;

      navigator.mediaDevices
        .getUserMedia({ video: { facingMode: "user" } })
        .then((stream) => {
          video.srcObject = stream;
        });

      function switchMode(mode) {
        isProcessing = true;
        isPaused = false;
        pauseBtn.innerHTML = "⏸️ 暫停";

        document.getElementById("start-panel").style.display = "none";
        mainTitle.style.display = "none";
        document.getElementById("control-panel").style.display = "block";

        container.classList.add("mobile-fullscreen");
        if (container.requestFullscreen) {
          container
            .requestFullscreen()
            .catch((e) => console.log("原生全螢幕忽略，使用 CSS 滿版"));
        }

        outputImg.src =
          "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        outputImg.alt = "⏳ 載入 AI 決策引擎中，請稍候...";
        ws.send(JSON.stringify({ action: "switch_mode", mode: mode }));
      }

      function togglePause() {
        isPaused = !isPaused;
        pauseBtn.innerHTML = isPaused ? "▶️ 繼續" : "⏸️ 暫停";
      }

      function stopMode() {
        isPaused = true;
        ws.send(JSON.stringify({ action: "stop" }));

        if (document.fullscreenElement) {
          document.exitFullscreen().catch((e) => console.log(e));
        }
        container.classList.remove("mobile-fullscreen");

        document.getElementById("start-panel").style.display = "block";
        mainTitle.style.display = "block";
        document.getElementById("control-panel").style.display = "none";

        outputImg.src =
          "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
        outputImg.alt = "🛑 已停止，請重新選擇模式";
      }

      let lastAdvice = "";

      ws.onmessage = (event) => {
        const data = JSON.parse(event.data);

        if (data.status === "ready") {
          console.log("✅ 後端就緒！開始串流...");
          isProcessing = false;
        } else if (data.image) {
          outputImg.src = data.image;
          isProcessing = false;
        }

        if (
          data.advice &&
          data.advice !== lastAdvice &&
          data.advice !== "等待 AI 教練講評中..." &&
          data.advice !== "準備好就開始吧！"
        ) {
          lastAdvice = data.advice;

          let utterance = new SpeechSynthesisUtterance(data.advice);
          utterance.lang = "zh-TW";
          utterance.rate = 1.15;
          utterance.pitch = 1.0;

          window.speechSynthesis.speak(utterance);
        }
      };

      function streamVideo() {
        if (
          !isPaused &&
          ws.readyState === WebSocket.OPEN &&
          video.readyState === 4
        ) {
          if (isProcessing && Date.now() - lastFrameTime > 1500) {
            isProcessing = false;
          }

          if (!isProcessing) {
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const base64Img = canvas.toDataURL("image/jpeg", 0.4);

            isProcessing = true;
            lastFrameTime = Date.now();
            ws.send(JSON.stringify({ image: base64Img }));
          }
        }
        requestAnimationFrame(streamVideo);
      }

      requestAnimationFrame(streamVideo);
    </script>
  </body>
</html>
